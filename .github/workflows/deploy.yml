# Promotion pipeline: main -> test (UAT) -> prod.
#
# * On merge to main, only the units changed by the push are deployed to test, then to prod
#   after the prod environment's required reviewers approve.
# * Run it manually (from main) to promote a chosen set of units, for example to redeploy a unit,
#   recover a failed run, or deploy to test without promoting to prod.
name: Deploy

on:
  push:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:
    inputs:
      units:
        description: "Units to deploy, comma separated: team/unit or team/* (e.g. finance-analytics/claims-summary)"
        type: string
        required: true
      include_prod:
        description: Continue to prod after test (prod still needs approval)
        type: boolean
        default: true
      dry_run:
        description: Dry run (validate and stage only)
        type: boolean
        default: false

permissions:
  contents: read

# No concurrency group on purpose: GitHub keeps only one pending run per group and cancels the
# others, which would silently drop a merged change. Runs may overlap instead; each deploy job
# skips units that a newer commit on main has changed (that commit's own run deploys them), so an
# older run never overwrites newer content.

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      units: ${{ steps.plan.outputs.units }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - name: Only main can be promoted
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Promotions must run from main (this run is on $REF)."
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Mode
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run == true || vars.DEPLOY_DRY_RUN == 'true' }}
        run: echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Work out what to deploy
        id: plan
        env:
          PYTHONPATH: scripts
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          UNITS: ${{ inputs.units }}
          INCLUDE_PROD: ${{ github.event_name == 'push' || inputs.include_prod == true }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          args=(plan --env test)
          if [ "$INCLUDE_PROD" = "true" ]; then args+=(--env prod); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--allow-placeholder); fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            args+=(--units "$UNITS" --title "Manual promotion")
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::This push has no previous commit to compare with. Run this workflow manually and list the units to deploy."
            exit 1
          else
            args+=(--base "$BEFORE" --head "$SHA" --diff-mode two-dot --title "Promotion of $SHA")
          fi
          python -m pbi_promote "${args[@]}"

  test:
    name: Test (UAT)
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: test
      units: ${{ needs.plan.outputs.units }}
      sha: ${{ github.sha }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
      skip_superseded: true
    secrets: inherit

  prod:
    name: Production
    needs: [plan, test]
    if: needs.plan.outputs.has_changes == 'true' && (github.event_name == 'push' || inputs.include_prod == true)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      units: ${{ needs.plan.outputs.units }}
      sha: ${{ github.sha }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
      skip_superseded: true
    secrets: inherit
