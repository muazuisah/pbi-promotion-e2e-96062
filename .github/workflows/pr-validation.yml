# Required status check for every pull request into main.
# Checks the work-item ID in the branch name and title, that the change touches one team only
# (and does not mix team and platform files), and validates every changed unit.
name: PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The validator and configuration always come from main, so a pull request cannot relax the rules it is checked against.
      - name: Check out trusted validator (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate
        env:
          PYTHONPATH: trusted/scripts
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python -m pbi_promote validate-pr \
            --repo-root pr \
            --config-root trusted/config \
            --codeowners trusted/.github/CODEOWNERS \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$HEAD_REF" \
            --title "$PR_TITLE"
