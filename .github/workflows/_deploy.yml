# Reusable job: deploys a list of units to one environment (test or prod, or dev from deploy-dev.yml).
# The job runs in a GitHub environment, so environment protection rules (required reviewers,
# branch restrictions) and environment variables apply.
name: Deploy units (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: dev, test or prod
        type: string
        required: true
      units:
        description: JSON list of team/unit keys from the plan job
        type: string
        required: true
      sha:
        description: Commit to deploy
        type: string
        required: true
      dry_run:
        description: Validate and stage only; do not call Fabric
        type: boolean
        default: false
      skip_superseded:
        description: Skip units that a newer commit on main has changed
        type: boolean
        default: false
    secrets:
      AZURE_CLIENT_SECRET:
        description: Only needed when the environment uses a client secret instead of OIDC
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out ${{ inputs.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual but the plan was made for $EXPECTED_SHA."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install fabric-cicd
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Deploy
        env:
          PYTHONPATH: scripts
          TARGET_ENV: ${{ inputs.environment }}
          UNITS: ${{ inputs.units }}
          SHA: ${{ inputs.sha }}
          DRY_RUN: ${{ inputs.dry_run || vars.DEPLOY_DRY_RUN == 'true' }}
          SKIP_SUPERSEDED: ${{ inputs.skip_superseded }}
          # Service principal for this environment (environment-level variables).
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          args=(deploy --env "$TARGET_ENV" --units-json "$UNITS" --commit "$SHA" --report "$RUNNER_TEMP/deploy-report.json")
          if [ "$SKIP_SUPERSEDED" = "true" ]; then args+=(--skip-superseded-by origin/main); fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
            echo "::notice::Dry run: nothing will be published to Fabric."
          elif [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Set the AZURE_CLIENT_ID and AZURE_TENANT_ID variables on the '$TARGET_ENV' environment."
            exit 1
          fi
          python -m pbi_promote "${args[@]}"

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-report-${{ inputs.environment }}
          path: ${{ runner.temp }}/deploy-report.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90
